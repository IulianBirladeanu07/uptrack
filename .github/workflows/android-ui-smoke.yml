name: Android UI smoke

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: "Optional EAS Android preview build ID (blank selects the latest successful preview build for this commit)"
        required: false
        type: string
        default: ""
      confirm_ui_test:
        description: "Download the selected APK and run the non-destructive Maestro smoke flow"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  maestro:
    if: ${{ inputs.confirm_ui_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: eas-preview
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve EAS build and verify token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID_INPUT: ${{ inputs.eas_build_id }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error title=Missing secret::Set EXPO_TOKEN in the eas-preview GitHub environment."
            exit 1
          fi
          raw_value="$EAS_BUILD_ID_INPUT"
          if [[ -z "$raw_value" ]]; then
            npx --yes eas-cli@25.0.0 build:list \
              --platform android \
              --build-profile preview \
              --status finished \
              --git-commit-hash "$GITHUB_SHA" \
              --limit 1 \
              --json > eas-builds.json
            raw_value="$(node -e "const result=JSON.parse(require('fs').readFileSync('eas-builds.json','utf8')); const builds=Array.isArray(result)?result:(result.builds??[]); process.stdout.write(builds[0]?.id??'')")"
            if [[ -z "$raw_value" ]]; then
              echo "::error title=No matching preview APK::No finished Android preview build was found for this commit. Run Android preview build first, then retry."
              exit 1
            fi
          elif [[ "$raw_value" =~ https?://[^[:space:]]+/builds/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}) ]]; then
            raw_value="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$raw_value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=Invalid build ID::Provide a valid EAS build UUID or Expo build URL."
            exit 1
          fi
          echo "EAS_BUILD_ID=$raw_value" >> "$GITHUB_ENV"
          echo "::notice title=Selected EAS build::$raw_value"

      - name: Download selected EAS APK
        id: download
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          npx --yes eas-cli@25.0.0 build:download --build-id "$EAS_BUILD_ID" --json > eas-download.json
          apk_path="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('eas-download.json', 'utf8')).path ?? '')")"
          if [[ "$apk_path" != *.apk || ! -f "$apk_path" ]]; then
            echo "::error title=APK download failed::The selected EAS build did not provide a downloadable APK."
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Install Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION=2.11.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run auth form smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.download.outputs.apk_path }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install "$APK_PATH"
            maestro --version
            mkdir -p test-results
            maestro test --format JUNIT --output test-results/maestro.xml .maestro/flows/auth-form-validation.yaml

      - name: Upload Maestro report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-smoke-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
