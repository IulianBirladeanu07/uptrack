name: Android UI smoke

on:
  workflow_dispatch:
    inputs:
      eas_build_id:
        description: "EAS Android preview build ID to test"
        required: true
        type: string
      confirm_ui_test:
        description: "Download the selected APK and run the non-destructive Maestro smoke flow"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  maestro:
    if: ${{ inputs.confirm_ui_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: eas-preview
    env:
      EAS_BUILD_ID: ${{ inputs.eas_build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify inputs and EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID_INPUT: ${{ inputs.eas_build_id }}
        shell: bash
        run: |
          raw_value="$EAS_BUILD_ID_INPUT"
          if [[ "$raw_value" =~ https?://[^[:space:]]+/builds/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}) ]]; then
            raw_value="${BASH_REMATCH[1]}"
          fi
          if [[ ! "$raw_value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=Invalid build ID::Provide the UUID or Expo build URL of a completed EAS Android preview build."
            exit 1
          fi
          echo "EAS_BUILD_ID=$raw_value" >> "$GITHUB_ENV"
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error title=Missing secret::Set EXPO_TOKEN in the eas-preview GitHub environment."
            exit 1
          fi

      - name: Download selected EAS APK
        id: download
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          npx --yes eas-cli@25.0.0 build:download --build-id "$EAS_BUILD_ID" --json > eas-download.json
          apk_path="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('eas-download.json', 'utf8')).path ?? '')")"
          if [[ "$apk_path" != *.apk || ! -f "$apk_path" ]]; then
            echo "::error title=APK download failed::The selected EAS build did not provide a downloadable APK."
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Install Maestro CLI
        shell: bash
        run: |
          export MAESTRO_VERSION=2.11.0
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run auth form smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.download.outputs.apk_path }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install "$APK_PATH"
            maestro --version
            mkdir -p test-results
            maestro test --format JUNIT --output test-results/maestro.xml .maestro/flows/auth-form-validation.yaml

      - name: Upload Maestro report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-smoke-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
